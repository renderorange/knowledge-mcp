name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Run tests
        run: go test -v ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"
          cache: true

      - name: Determine version
        id: version
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build
        run: go build -ldflags "-X main.version=${{ steps.version.outputs.version }}" -o knowledge-mcp .

      - name: Verify version flag
        run: |
          VERSION_OUTPUT=$(./knowledge-mcp --version)
          echo "Binary version: $VERSION_OUTPUT"
          if [ "$VERSION_OUTPUT" != "${{ steps.version.outputs.version }}" ]; then
            echo "Version mismatch: expected ${{ steps.version.outputs.version }}, got $VERSION_OUTPUT"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-mcp
          path: knowledge-mcp
          retention-days: 7
