project: knowledge-mcp
version: 1
entries:
    - id: conv-001
      summary: 'Go project standards: gofmt, go vet, go test, GH-N commits'
      detail: |-
        Format: gofmt (make fmt runs gofmt -s -w .). gofmt -l must output nothing.
        Verify: go test ./... and go vet ./... must pass before work is claimed done; go build ./... must compile all packages.
        Make targets: all (fmt tidy lint test build), build, build-all, test, clean, install, lint (golangci-lint or go vet fallback), fmt, tidy.
        Build command: make build or go build -o knowledge-mcp .
        Module: github.com/renderorange/knowledge-mcp (README title knowledge-mcp). Go style follows the codebase, not external linters.

        Deploy (corrected 2026-11-26, finally): `make install` and install.sh share one resolution (scripts/install-dir.sh): reuse the existing install's directory when writable — /home/blaine/bin here, which is what the MCP server in ~/.config/opencode/opencode.jsonc runs — else the first writable $HOME/* or /usr/local/bin dir on PATH, else ~/.local/bin. So `make install` deploys where the config reads, by construction. install.sh downloads the latest GitHub release binary, so it cannot deploy an unreleased local build.
        To deploy a local build: make build, then install -m 755 knowledge-mcp /home/blaine/bin/knowledge-mcp, then restart the server. Use install(1), not cp: cp onto a running binary fails with "Text file busy" because the server holds the file open, and install unlinks first.
        Verify with --version (must show the new git describe string, not the previous release tag), then confirm the restarted process has no "(deleted)" suffix: readlink /proc/$(pgrep -f bin/knowledge-mcp | head -1)/exe.
        Deploying does not update the running server: replacing the binary leaves the live process executing the old inode. A restart is mandatory, and only the client can do it.
      rule: gofmt -l and go vet ./... and go test ./... must all pass before claiming a change is done
      source: code review, 2026-09-08
      date: "2026-11-26"
    - id: conv-002
      summary: Knowledge entry content rules for this project's own store
      detail: |-
        Detail is 10-20 lines of query-able facts, not source copies.
        Summary is a topic line (max 100 chars); enforcement text goes in the rule field, which list_knowledge surfaces as constraints.
        Every entry carries source (provenance) and date. Update date on entry changes.
        IDs are sequential per category: conv-NNN, sub-NNN, dec-NNN.
      rule: Keep detail at summary level; never copy source files into detail
      source: README token-savings guidance, 2026-09-08
      date: "2026-09-08"
