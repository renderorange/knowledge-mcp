project: knowledge-mcp
version: 1
entries:
    - id: sub-001
      summary: 'Search index: in-memory bleve, auto-refresh on store edits, scoped keys'
      detail: |-
        The index is built in memory (bleve.NewMemOnly) at server startup from the store YAML/MD files — every restart re-indexes.
        There is no disk state, no index lock, and any number of instances may query concurrently.
        A store fingerprint (per-file path, size, mtime) is recorded at build time; Query recomputes it and rebuilds into a fresh index when the files changed, so direct edits, git checkouts and migration scripts are searchable without a restart.
        Rebuild is build-then-swap under an RWMutex: queries in flight finish on the old index, then it is closed. There is no Delete API, so deletes vanish only because the replacement index is built from scratch.
        reindex_knowledge forces a rebuild; Refresh reports whether the fingerprint changed.
        Documents carry summary, detail, rule, category, project with scoped keys <project>/<entryID>.
        Query results de-scope the ID. Org-level docs: every top-level *.md in .agents/knowledge/ (knowledge.OrgKnowledgeFiles), split on "## " headings with keys org-<file>::<heading>.
        User query text is escaped (escapeQueryString) so special characters are literal, never lucene syntax.
        --index and --no-index-on-startup are accepted warning-logged no-ops.
      source: GH-34 memory-only index, 2026-10-07
      date: "2026-10-23"
    - id: sub-002
      summary: 'Project resolver: kinds, addressing, dynamic fallback'
      detail: |-
        projects/resolver.go builds refs: KindProject (has .agents/ yaml), KindOrg (root with .agents/knowledge/), KindGlobal (--global path, addressed _global).
        Roots scan immediate children only, skipping .agents and .git; symlinks followed; unreadable entries warn.
        Addressing: bare name when unique, else <qualifier>/<name>; org roots always win their bare name; duplicate root basenames are a startup error.
        Resolve falls back dynamically for paths created after startup (resolveDynamicBare/Qualified); Covers checks known paths and root prefixes.
      source: code review, 2026-09-08; GH-34 update, 2026-10-07
      date: "2026-10-07"
    - id: sub-003
      summary: 'Knowledge store: atomic writes, per-file locks, entry lifecycle'
      detail: |-
        knowledge/store.go: Save writes YAML via temp file, fsync, rename (atomic); LoadOrCreate returns an empty KnowledgeFile when missing; SaveText does the same for org markdown.
        tools package keeps per-path RWMutexes (fileLocks) around read-modify-write cycles; write/update lock, list takes RLock.
        NextID scans existing IDs for the category prefix and returns the next sequential ID.
        write_knowledge validates summary <=100 chars, detail <=1MB, rule <=200 chars. category is required for project stores and ignored on org roots.
        Org root write: file is required (bare *.md, no directories; missing file lists available names; a new name creates the file), summary is the ## heading, detail the body, source becomes a trailing Source: line, rule is rejected, and a heading collision points at update_knowledge. knowledge.AppendOrgSection/SaveText run under fileLocks.
        update_knowledge on an org root takes id org-<file>::<heading>; only detail applies, the heading is immutable, the trailing Source: line is preserved, and the file must already exist. knowledge.ReplaceOrgSection rewrites just that section.
        OrgKnowledgeFiles returns sorted top-level *.md names and skips directories, broken symlinks, and other non-regular files (symlinks to regular files are followed).
        update_knowledge validates supersedes references an existing ID in the same category and rejects no-op updates for project stores.
        Rules surface as a constraints section in list_knowledge output, above regular entries.
      source: code review, 2026-09-08
      date: "2026-10-26"
    - id: sub-004
      summary: 'Startup indexing: always-on background kick, no skip flag'
      detail: |-
        IndexAll always runs in a background goroutine at startup (there is no skip flag).
        Queries block on the ready channel until IndexAll completes.
        readyOnce (sync.Once) prevents a double-close panic on the ready channel.
        --no-index-on-startup and --index are deprecated, accepted, warn, and do nothing.
        The index lives only as long as the process and is rebuilt from the store files on every startup.
      source: GH-34 memory-only index, 2026-10-07
      date: "2026-10-07"
