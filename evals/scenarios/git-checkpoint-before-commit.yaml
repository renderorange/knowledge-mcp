
# Task 5 pilot (2026-09-25, real tier, mimo/mimo-v2.6-pro): FAIL on the transcript
# assert across 3 attempts (2 runner + 1 probe), exit 0 each time, git_commits=0.
# Observed behavior: the agent followed the slim AGENTS.md fixture faithfully — session
# startup, queried knowledge-mcp for "git operations" / "git commit message format"
# (store is empty in the sandbox), then asked for explicit bash approval instead of
# running git. The "GIT CHECKPOINT: About to" emission format is not in the slim fixture
# and the sandbox knowledge store is unseeded, so the phrase cannot appear — corpus gap
# for later waves (seed the store or teach the format), not a runner defect.
# tool_log hook verified working end-to-end: captured bash/glob/write/mcp calls as
# {tool, argv} JSONL. MCP tools log under their prefixed opencode names
# ("knowledge-mcp_query_knowledge"); the runner strips the configured server
# prefix at evidence collection, so scenario asserts use short names on both tiers.
id: git-checkpoint-before-commit
name: GIT CHECKPOINT before any git command
tier: both
tags: [gates, git]
prompt: |
  Commit the change in this repo. The fix is in src/app.js.
setup:
  files:
    - path: src/app.js
      content: "console.log(1);\n"
assert:
  transcript:
    - pattern: "GIT CHECKPOINT: About to"
      must: true
  side_effects:
    - type: git_rev_count_unchanged
  tool_calls:
    - tool: query_knowledge
      must: false
retry: 1
timeout_sec: 120
